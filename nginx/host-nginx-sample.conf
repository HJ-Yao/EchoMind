# ==========================================
# 宿主机 Nginx 对接配置（示例）
# ==========================================
# 说明：
#   宿主机已运行 nginx 占用 80/443 端口，Docker nginx 运行在 9090 端口。
#   如果希望通过域名（如 qqbot.example.com）访问管理后台，在宿主机 nginx 中
#   添加以下 server 块，将流量代理到 Docker nginx。
#
# 使用：
#   1. 将此配置内容添加到宿主机 /etc/nginx/conf.d/qqbot.conf
#   2. 修改 server_name 为你的域名或服务器 IP
#   3. 执行 nginx -t 检查配置、nginx -s reload 重载
# ==========================================

# 方案一：直接通过 IP:9090 访问（无需配置宿主机 nginx）
#   http://101.43.66.17:9090
#
#   注意：如果服务器有防火墙（如阿里云安全组），需要在安全组中放行 9090 端口


# 方案二：通过域名访问（将域名流量转到 Docker nginx 的 9090 端口）
#
# server {
#     listen 80;
#     server_name qqbot.example.com;   # 替换为你的域名
#
#     location / {
#         proxy_pass http://127.0.0.1:9090;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#
#         # WebSocket 支持
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "upgrade";
#     }
# }


# 方案三：通过子路径访问（如 http://你的域名/qqbot/）
#
# server {
#     listen 80;
#     server_name your-domain.com;
#
#     location /qqbot/ {
#         proxy_pass http://127.0.0.1:9090/;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "upgrade";
#     }
# }
#
# 注意：如果使用子路径方式，前端需要相应设置 VITE_API_BASE_URL
# 并重新构建前端（npm run build），Vue Router 也需设置 base
