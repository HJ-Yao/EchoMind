# ==========================================
# QQBot 生产环境配置
# ==========================================

spring:
  # PostgreSQL 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/qqbot}
    username: ${DB_USERNAME:qqbot}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: QQBotHikariCP
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  # JPA 配置（生产环境不自动建表，使用 SQL 脚本管理）
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# QQBot 核心配置
qqbot:
  # OneBot11 配置
  onebot:
    # WebSocket 连接配置（连接 NapCat）
    ws:
      url: ${QQBOT_WS_URL:ws://127.0.0.1:3001}
      token: ${QQBOT_WS_TOKEN}
      auto-reconnect: true
      max-reconnect-attempts: -1
      reconnect-base-delay: 5
      reconnect-max-delay: 60
    # HTTP API 配置（调用 OneBot API 发送消息）
    http:
      url: ${QQBOT_HTTP_URL:http://127.0.0.1:3000}
      token: ${QQBOT_HTTP_TOKEN}

  # AI 配置（阿里云百炼 MaaS 平台 - OpenAI 兼容模式）
  # 专属实例: ws-ejqzyf5azzcyjs4i.cn-beijing.maas.aliyuncs.com
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL:https://ws-ejqzyf5azzcyjs4i.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      model: ${DASHSCOPE_MODEL:qwen3.7-max}
      temperature: 0.7
      max-tokens: 4096

# 生产环境日志级别
logging:
  level:
    root: WARN
    com.qqbot: INFO

# Spring 管理端点（生产环境仅暴露健康检查）
management:
  endpoints:
    web:
      exposure:
        include: health,info
